# Coldline - Task 4.2
# File: config/auth.yaml
# Component: Token verification settings
# Purpose: Configure the supplied TokenVerifier: the issuer it trusts, the audience it serves, where its keys are, and the clock allowance.
# Interacts With: src/api/security/tokens.py, the issuer's discovery document, docs/security/access-policy.md
# Sprint/Task: Sprint 4 - Project 4 / Task 4.2
# Concepts: OIDC discovery, JWKS, pinned algorithms, clock leeway
# Tools: YAML

# Step 1 of the Task: fill in every value and keep the five keys as they are. The API
# image carries this file as it was when `poe start` built it, so run `poe start` again
# after editing it. `poe token-check <fixture>` reads it directly, with no rebuild.

# The `issuer` value of the issuer's discovery document (README.md lists its URL).
issuer: "https://issuer.coldline.test"

# The API audience in docs/security/access-policy.md: the name of the API a token is
# for, not the party that signed it.
audience: "coldline-api"

# The `jwks_uri` value of the discovery document, as printed.
jwks_url: "http://localhost:8180/.well-known/jwks.json"

# A list holding only the `alg` the key set at jwks_url declares, for example
# algorithms: ["<alg>"]. The verifier never trusts the algorithm a token names.
algorithms: ["RS256"]

# The allowance, in whole seconds, for clock differences between machines, inside the
# range docs/security/access-policy.md allows.
leeway_seconds: 30
