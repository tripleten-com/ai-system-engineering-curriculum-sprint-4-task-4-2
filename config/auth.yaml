# Coldline - Task 4.2
# File: config/auth.yaml
# Component: Token verification settings
# Purpose: Configure the supplied TokenVerifier: the issuer it trusts, the audience it serves, where its keys are, and the clock allowance.
# Interacts With: src/api/security/tokens.py, the issuer's discovery document, docs/security/access-policy.md
# Sprint/Task: Sprint 4 - Project 4 / Task 4.2
# Concepts: OIDC discovery, JWKS, pinned algorithms, clock leeway
# Tools: YAML

# Never exported. Known-wrong variant "audience-is-issuer": the reference completion with
# `audience` set to the issuer's URL, the lesson's named common mistake. The routes.py and
# the student tests beside it are the reference's. With this file the verifier refuses
# dispatcher-valid for its audience claim (401) and refuses gateway-valid, wrong-role, and
# missing-scope for the same reason instead of 403, so in
# tests/contract/test_exception_access.py exactly this set fails:
# test_auth_config_audience_is_the_access_policy_audience,
# test_dispatcher_valid_receives_200_with_the_stored_summary,
# test_unauthorized_fixtures_receive_403[gateway-valid|wrong-role|missing-scope], and
# test_each_rejection_test_asserts_the_exact_status_without_the_summary (under the
# status-swapped mutation the three 403 tests receive 403 for a swapped authentication
# failure and pass, which the row forbids). Every other row passes.

issuer: "https://issuer.coldline.test"

audience: "https://issuer.coldline.test"

jwks_url: "http://localhost:8180/.well-known/jwks.json"

algorithms: ["RS256"]

leeway_seconds: 30
